<!doctype html><html><head><meta charset="utf-8"><title>Wi-Fi Health Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{font-family:Arial;margin:16px;background:#0f172a;color:#e2e8f0}.card{background:#1e293b;padding:12px;border-radius:10px;margin:8px;min-width:180px}.row{display:flex;flex-wrap:wrap}.badge{font-size:22px;padding:6px 14px;border-radius:20px}.Normal{background:#16a34a}.Degraded{background:#f59e0b}.Severe{background:#dc2626}canvas{background:#fff;border-radius:10px}button{margin:4px}</style></head><body>
<h2>AI Wi-Fi Health Monitor</h2>
<div class="row"><div class="card"><div>Status <span id="badge" class="badge Normal">Normal</span></div><div id="cause"></div><div id="score"></div><ul id="ev"></ul></div>
<div class="card">RSSI<div id="rssi">-</div></div><div class="card">Ping<div id="ping">-</div></div><div class="card">Loss<div id="loss">-</div></div><div class="card">DNS<div id="dns">-</div></div></div>
<div><button onclick="setH(1)">1h</button><button onclick="setH(6)">6h</button><button onclick="setH(24)">24h</button><span id="lbl"></span></div>
<canvas id="ch" height="120"></canvas>
<h3>Anomalies</h3><ul id="anom"></ul>
<script>
let H=1, chart;
const API=(location.protocol.startsWith("http")&&location.hostname? "http://"+location.hostname+":8000" : "http://127.0.0.1:8000");
async function j(u){const r=await fetch(u);return r.json();}
async function tick(){
 try{
  const l=await j(API+"/latest");
  document.getElementById("rssi").textContent=l.rssi??"-";
  document.getElementById("ping").textContent=l.ping_ms??"-";
  document.getElementById("loss").textContent=l.loss_pct??"-";
  document.getElementById("dns").textContent=l.dns_ms??"-";
  const a=await j(API+"/analysis/latest");
  if(a.status){const b=document.getElementById("badge");b.textContent=a.status;b.className="badge "+a.status;
   document.getElementById("cause").textContent="Cause: "+(a.cause||"")+" ("+((a.confidence||0)*100).toFixed(0)+"%)";
   document.getElementById("score").textContent="Score: "+(a.score??"");
   document.getElementById("ev").innerHTML=(JSON.parse(a.evidence||"[]")).map(e=>"<li>"+e+"</li>").join("");}
  const an=await j(API+"/anomalies?hours="+H);
  document.getElementById("anom").innerHTML=an.slice(0,20).map(x=>"<li>"+new Date(x.ts*1000).toLocaleTimeString()+" "+x.probe_id+" "+x.status+" "+x.cause+" "+x.score+"</li>").join("");
 }catch(e){}
}
async function hist(){
 try{
  const h=await j(API+"/history?hours="+H);
  document.getElementById("lbl").textContent=" rows "+h.length;
  const d=h.slice(-300);
  const data={labels:d.map(r=>new Date(r.ts*1000).toLocaleTimeString()),datasets:[{label:"ping",data:d.map(r=>r.ping_ms),borderColor:"red",pointRadius:0},{label:"dns",data:d.map(r=>r.dns_ms),borderColor:"blue",pointRadius:0}]};
  if(chart)chart.destroy();chart=new Chart(document.getElementById("ch"),{type:"line",data,options:{animation:false}});}catch(e){}
}
function setH(h){H=h;hist();}
setInterval(tick,4000);setInterval(hist,15000);tick();hist();
</script></body></html>
